name: Verify LogScope
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py analysis_rules.py demo.py sample_logs.py terminal_bridge.py terminal_child.py project_access.py install_skill.py skills/logscope/scripts/logscope.py skills/logscope/scripts/project.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/app.js
      - run: node --check dist/terminal.js
